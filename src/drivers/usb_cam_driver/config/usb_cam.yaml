/**:
  ros__parameters:
    # USB Front Camera Configuration (차선 인식용)
    video_device: "/dev/video4"
    image_width: 640
    image_height: 480
    pixel_format: "mjpeg2rgb"
    framerate: 30.0
    exposure_auto: 1       # Manual mode
    exposure_absolute: 100 # 10ms (빠른 셔터 스피드)
    frame_id: "camera_front"
    camera_topic: "/camera/front/image"

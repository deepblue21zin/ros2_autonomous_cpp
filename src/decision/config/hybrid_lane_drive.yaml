/**:
  ros__parameters:
    # 속도 제어
    cruise_speed_mps: 0.3      # 정상 주행 속도 (m/s)
    slow_speed_mps: 0.2        # 장애물 회피/차선 변경 시 속도 (m/s)

    # 조향 제어
    max_steer_rad: 0.45        # 최대 조향각 (rad, 약 25도)
    kp: 2.5                    # 비례 게인 (조향 강도)
    kd: 0.6                    # 미분 게인 (안정성)

    # 장애물 검출
    obstacle_detect_threshold: 0.3  # 장애물 감지 임계값 (30%)

    # 차선 변경 파라미터
    lane_change_steer_rad: 0.4     # 차선 변경 시 고정 조향각 (rad)
    lane_change_duration_sec: 1.5  # 차선 변경 조향 유지 시간 (초)
    stabilize_duration_sec: 0.5    # 차선 변경 후 안정화 대기 (초)
    lane_return_delay_sec: 2.0     # 장애물 통과 후 복귀까지 대기 (초)

    # 신호등
    use_traffic_light: true    # 신호등 사용 여부

    # 제어 주기
    control_hz: 20.0           # 제어 루프 주기 (Hz)

# ============================================
# 튜닝 가이드
# ============================================
#
# 1. 조향이 약하면:
#    kp: 2.5 → 3.0 → 3.5
#
# 2. 조향이 진동하면:
#    kd: 0.6 → 0.8 → 1.0
#    또는 kp를 줄이기: 3.0 → 2.5
#
# 3. 차선 변경이 덜 되면:
#    lane_change_steer_rad: 0.4 → 0.45 → 0.5 (조향각 증가)
#    lane_change_duration_sec: 1.5 → 2.0 (유지 시간 증가)
#
# 4. 차선 변경 후 불안정하면:
#    stabilize_duration_sec: 0.5 → 0.8 → 1.0
#
# 5. 복귀가 너무 빠르면:
#    lane_return_delay_sec: 2.0 → 3.0
#
# 6. 속도 조정:
#    cruise_speed_mps: 0.3 → 0.35 → 0.4
#    slow_speed_mps: 0.2 → 0.25
#
# 7. 장애물 감지가 민감하면:
#    obstacle_detect_threshold: 0.3 → 0.2 (더 민감)
#    obstacle_detect_threshold: 0.3 → 0.4 (덜 민감)

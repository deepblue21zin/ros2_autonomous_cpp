/**:
  ros__parameters:
    # Lane Tracking Parameters (2026 경기도 대회 트랙 최적화)
    # Sliding Window + RANSAC 방식
    kp: 5.5                 # P 게인 (선형 범위 ±40%, 7.0은 ±14%만 선형 → 진동 원인)
    kd: 3.0                 # D 게인 (offset 변화율 감쇠, 오버슈트 방지)
    roi_y_ratio: 0.25       # ROI 시작 위치 (BEV시 0.40~0.55 권장, 0.20은 왜곡 과다)

    # 전처리 방식 선택
    use_grayscale_threshold: false  # true: Grayscale Binary Threshold, false: HSV Threshold

    # 전처리: 주름/텍스처 노이즈 억제
    gaussian_kernel: 9      # 가우시안 블러 커널 크기 (클수록 노이즈 제거 강함, 밝은 환경 노이즈 대응)

    # 단일 차선 감지 시 가상 센터라인 계산용
    lane_width_ratio: 0.55  # 차선 간격 = 이미지 폭 × 비율 (좁은 화각: 0.50~0.65)
    max_steer_delta: 0.20   # 프레임 간 steering 최대 변화량 (rate limit)

    # 동적 lookahead: 곡률 기반 전방 주시거리 자동 조절
    lookahead_min_ratio: 0.15   # 커브 시 최소 lookahead (가까이 → 반응성)
    lookahead_max_ratio: 0.50   # 직선 시 최대 lookahead (멀리 → 안정성)
    lookahead_curvature_k: 50.0 # 곡률 감도 (클수록 커브에서 빨리 줄어듦)

    # Polynomial 계수 EMA 평활 (search-around-poly 안정화, 현재 프레임 조향에는 직접 영향 없음)
    coeff_ema_alpha: 0.4        # 0.3=강한평활(지연↑), 0.7=약한평활(반응↑)

    # Predict+Hold: 차선 소실 시 이전 결과 유지
    max_lost_frames: 30     # 양쪽 소실 최대 유지 프레임 (30Hz 기준 ~2.7초)
    max_single_lane_hold: 90  # 단일 차선 감지 시 이전 center 유지 프레임 (30Hz 기준 ~0.33초)

    # 횡단보도 Predict+Hold
    crosswalk_density_threshold: 0.31   # ROI 흰 픽셀 밀도 > 30% → 횡단보도 판정 (커브 오판 방지)
    crosswalk_density_max: 0.32         # 밀도 > 50% → 과노출 bad frame (횡단보도 아님)
    max_crosswalk_frames: 60            # 횡단보도 hold 상한 (30Hz 기준 2초)

    # Search-around-poly (이전 polynomial 주변 탐색)
    search_around_margin: 60        # polynomial 좌우 탐색 범위 (px, 클수록 넓게)
    search_around_fallback: 3       # 연속 N회 실패 시 히스토그램 full search로 전환

    # 이동 평균
    avg_window: 7          # 넓은 점선 간격 대응 (약 0.33초 유지)

    # Bird's Eye View (탑뷰 변환)
    # 캘리브레이션 방법:
    #   1. bev_draw_trapezoid: true 로 설정
    #   2. rviz2 Lane Overlay에서 노란색 사다리꼴이 차선과 일치하는지 확인
    #   3. 사다리꼴 꼭짓점(tl/tr/bl/br) x비율을 차선에 맞게 조정
    #   4. 캘리브레이션 완료 후 bev_draw_trapezoid: false
    use_bev: false                  # BEV 활성화
    bev_src_tl_x: 0.30            # 상단-좌 x비율 (ROI 맨 위, 먼 쪽 왼쪽 차선 위치)
    bev_src_tr_x: 0.70            # 상단-우 x비율 (ROI 맨 위, 먼 쪽 오른쪽 차선 위치)
    bev_src_bl_x: 0.0             # 하단-좌 x비율 (ROI 맨 아래, 가까운 쪽 왼쪽 차선)
    bev_src_br_x: 1.0             # 하단-우 x비율 (ROI 맨 아래, 가까운 쪽 오른쪽 차선)
    bev_draw_trapezoid: false       # 캘리브레이션 모드: 사다리꼴 오버레이 표시

    # 디버그 (실제 주행 시 false 권장, false 시 overlay 생성 스킵)
    debug: true                    # 디버그 모드 활성화

    # RViz2 시각화
    # 컨테이너 내부에서 실행 시 false (호스트에서 ./rviz.sh 별도 실행)
    # 로컬 GUI 환경에서 실행 시 true
    use_rviz: false

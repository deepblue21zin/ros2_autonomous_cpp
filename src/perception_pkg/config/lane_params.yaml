/**:
  ros__parameters:
    # Lane Tracking Parameters (2026 경기도 대회 트랙 최적화)
    kp: 0.7                 # 조향 게인 (트랙 폭 850mm)
    roi_y_ratio: 0.30       # ROI 시작 위치

    # 전처리: 주름/텍스처 노이즈 억제
    gaussian_kernel: 7      # 5→7 (주름 블러 강화)
    canny_low: 80           # 60→80 (약한 엣지 무시)
    canny_high: 200         # 150→200 (강한 엣지만 통과)

    # Hough 변환: 짧은 주름선 필터링
    hough_threshold: 50     # 25→50 (충분한 증거 필요)
    hough_min_length: 30    # 10→30 (짧은 주름선 제거)
    hough_max_gap: 80       # 150→80 (관련없는 선 연결 방지)

    # 기울기 필터: 차선에 가까운 각도만 허용
    slope_min: 0.3          # 0.12→0.3 (거의 수평인 주름선 제거)
    slope_max: 2.0          # 수직에 가까운 선 제거 (63도, 급커브 대응)

    # 영역 필터: 좌우 영역에서만 차선 검출
    lane_x_margin: 0.35     # 좌측 35%, 우측 35% 영역만 차선으로 인정 (중앙 30% 무시)
    lane_y_bottom: 0.55     # 선이 하단 45% 영역을 지나야 차선으로 인정 (0.65→0.55, 코너 대응)

    # 이동 평균
    avg_window: 2           # 곡선 응답 개선

    # 디버그 (실제 주행 시 false 권장)
    debug: true

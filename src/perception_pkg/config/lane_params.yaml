/**:
  ros__parameters:
    # Lane Tracking Parameters (2026 경기도 대회 트랙 최적화)
    kp: 0.7                 # 0.6→0.7 (트랙 폭 850mm에 맞춰 응답성 향상)
    roi_y_ratio: 0.30       # 값이 작아질수록 하단으로부터 차선 인식 거리 증가, 이탈 방지
    # Canny 파라미터: 주름 인식 방지를 위해 threshold 증가
    canny_low: 60           # 25→60 (주름/그림자 엣지 무시)
    canny_high: 150         # 80→150 (강한 차선 엣지만 검출)
    gaussian_kernel: 5
    # 딜레이 감소: 대회 트랙 곡선 대응
    avg_window: 2           # 3→2 (66ms @30fps, 곡선 응답 개선)
    # 실제 주행 시 false 권장 (오버레이 생성 오버헤드 제거)
    debug: true
    # 대회 트랙 사양: 도로폭 850mm, 차선폭 50mm, 우측 차선 반시계방향 주행



